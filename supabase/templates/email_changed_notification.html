<!doctype html>
<html lang="fr">
<head>

</head>
<body style="margin:0;padding:0;background:#E7E2D8;font-family:'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif;color:#48525A">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#E7E2D8" style="background:#E7E2D8">
  <tr><td align="center" style="padding:32px 16px">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px">
      <tr><td style="padding:0 0 20px">
        <a href="{{ .SiteURL }}" style="text-decoration:none"><img src="{{ .SiteURL }}/email/logo.png" width="220" height="40" alt="Hôpital M&amp;M" style="display:block;border:0;width:220px;height:auto;font-family:'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif;font-size:22px;font-weight:700;color:#1D5C74"></a>
      </td></tr>
      <tr><td bgcolor="#FFFFFF" style="background:#FFFFFF;border:1px solid #D8D2C6;border-top:3px solid #1D5C74;padding:30px 28px">

        <h1 style="margin:0 0 18px;font-family:'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif;font-size:24px;line-height:1.2;font-weight:700;color:#1E262B">Votre adresse e-mail a été modifiée</h1>
        <p style="margin:0 0 14px;font-size:16px;line-height:1.55;color:#48525A">L'adresse de votre compte est passée de <strong style="color:#1E262B">{{ .OldEmail }}</strong> à <strong style="color:#1E262B">{{ .Email }}</strong>.</p>
      </td></tr>
      <tr><td style="padding:18px 4px 0">
        <p style="margin:0 0 10px;font-size:13px;line-height:1.5;color:#656C71">Ce n'était pas vous ? Prévenez tout de suite Maël ou Marin.</p>
        <p style="margin:0;font-family:'IBM Plex Mono', Menlo, Consolas, monospace;font-size:11px;letter-spacing:0.06em;color:#656C71">HÔPITAL M&amp;M · L'HÔPITAL DE FAMILLE DE MAËL ET MARIN<br>QUESTIONS : DEMANDER À MAËL OU À MARIN</p>
      </td></tr>
    </table>
  </td></tr>
